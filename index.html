<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор QR-кодов</title>
    <!-- Подключаем библиотеку для генерации QR напрямую из CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #1a1a1a; margin-top: 0; margin-bottom: 20px; font-size: 24px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: 0.3s; margin-bottom: 15px; }
        input[type="text"]:focus { border-color: #4f46e5; outline: none; }
        .settings { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; color: #4a5568; }
        .color-picker { display: flex; align-items: center; gap: 8px; }
        input[type="color"] { border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; background: none; }
        #qrcode { background: #f8fafc; padding: 20px; border-radius: 12px; display: inline-block; margin-bottom: 20px; border: 1px solid #edf2f7; min-height: 200px; min-width: 200px; }
        #qrcode img { margin: 0 auto; display: block; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-generate { background: #4f46e5; color: white; }
        .btn-generate:hover { background: #4338ca; }
        .btn-download { background: #10b981; color: white; display: none; }
        .btn-download:hover { background: #059669; }
    </style>
</head>
<body>

<div class="card">
    <h1>🖼️ QR Генератор</h1>
    
    <input type="text" id="qr-text" placeholder="Введите ссылку или текст..." value="https://github.com">
    
    <div class="settings">
        <div class="color-picker">
            <label for="qr-color">Цвет кода:</label>
            <input type="color" id="qr-color" value="#000000">
        </div>
    </div>

    <div id="qrcode"></div>

    <button class="btn-generate" onclick="generateQR()">Сгенерировать</button>
    <button class="btn-download" id="download-btn" onclick="downloadQR()">📥 Скачать PNG</button>
</div>

<script src="script.js"></script>
</body>
</html>
