<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Временная Почта</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h1 { color: #333; margin-bottom: 20px; }
        .email-box { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        input { padding: 12px; width: 70%; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; text-align: center; font-weight: bold; background: #fafafa; }
        button { padding: 12px 20px; border: none; background: #007bff; color: white; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .refresh-btn { background: #28a745; }
        .refresh-btn:hover { background: #218838; }
        .letters { text-align: left; margin-top: 30px; }
        .letter-item { background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 10px; border-left: 5px solid #007bff; cursor: pointer; }
        .letter-body { display: none; background: #fff; border: 1px solid #ddd; padding: 15px; margin-top: 5px; border-radius: 4px; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>⏳ Временная Почта</h1>
    
    <div class="email-box">
        <input type="text" id="email-address" readonly value="Генерация...">
        <button onclick="copyEmail()">📋 Копировать</button>
        <button class="refresh-btn" onclick="checkMail()">🔄 Обновить</button>
    </div>

    <div class="letters">
        <h3>Входящие письма:</h3>
        <div id="letters-list">Нет писем. Нажмите «Обновить» или подождите.</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
